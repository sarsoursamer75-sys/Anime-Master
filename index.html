<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أنمي ماستر</title>
<style>
  *{box-sizing:border-box;font-family:sans-serif}
  body{margin:0;background:#1a1638;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center}
  .box{width:92%;max-width:450px;background:#27224d;border-radius:20px;padding:22px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  h1{margin:0 0 5px;color:#ffce00;font-size:26px}
  .bar{display:flex;justify-content:space-between;background:#15122e;padding:10px 14px;border-radius:12px;margin:15px 0;font-weight:bold}
  .tag{display:inline-block;background:#3d3573;color:#ffce00;padding:4px 12px;border-radius:12px;font-size:13px;margin-bottom:10px}
  .q{background:#1f1b40;padding:18px;border-radius:14px;font-size:18px;font-weight:bold;min-height:95px;display:flex;align-items:center;justify-content:center;margin-bottom:15px;line-height:1.5}
  .opts{display:grid;gap:10px}
  button{background:#3a326e;color:#fff;border:none;padding:14px;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}
  button:active{background:#ffce00;color:#000}
  .lock{display:none;padding:15px 0}
  .timer{font-size:30px;font-weight:bold;color:#ff4757;margin:12px 0;direction:ltr}
</style>
</head>
<body>
<div class="box">
  <h1>⚔️ أنمي ماستر ⚔️</h1>
  <div class="bar">
    <div id="h">❤️❤️❤️</div>
    <div id="r">مبتدئ</div>
    <div id="s">1 / 100</div>
  </div>
  <div id="play">
    <div class="tag" id="an">...</div>
    <div class="q" id="qt">...</div>
    <div class="opts" id="op"></div>
  </div>
  <div class="lock" id="lk">
    <div style="font-size:45px">💔</div>
    <h3>انتهت قلوبك الـ 3 لهذا اليوم!</h3>
    <p style="font-size:14px;color:#ccc">لقد أخطأت 3 مرات. عد غداً لتكملة التحدي.</p>
    <div class="timer" id="tm">24:00:00</div>
  </div>
</div>
<script>
const Q=[
{a:"ون بيس",q:"🏴‍☠️👒🍖 من صاحب هذه الرموز؟",o:["لوفي","زورو","شانكس","إيس"],c:0},
{a:"ناروتو",q:"ما اسم الوحش المختوم داخل ناروتو؟",o:["شوكاكو","كوراما","غيوكي","سون غوكو"],c:1},
{a:"هجوم العمالقة",q:"ما اسم الفيلق صاحب شعار أجنحة الحرية؟",o:["الشرطة","الحامية","فيلق الاستطلاع","التدريب"],c:2},
{a:"ديث نوت",q:"📓🍎✍️ ما اسم الشينيغامي مرافق لايت؟",o:["ريم","ريوك","جيلوس","سيدو"],c:1},
{a:"دراغون بول",q:"كم عدد كرات التنين لاستدعاء شينرون؟",o:["5","6","7","9"],c:2},
{a:"قاتل الشياطين",q:"ما أسلوب التنفس الأول لتانجيرو؟",o:["اللهب","الرعد","الماء","الوحش"],c:2},
{a:"جوجوتسو كايسن",q:"من هو أقوى ساحر جوجوتسو حديث؟",o:["غوجو ساتورو","إيتادوري","ميغومي","نانامي"],c:0},
{a:"هنتر x هنتر",q:"ما هو نوع النين الخاص بغون؟",o:["التحويل","التعزيز","التجسيد","التلاعب"],c:1},
{a:"سولو ليفلينج",q:"ما لقب سونغ جين وو سابقاً؟",o:["ملك الظلال","أضعف صياد في البشرية","الخفي","سيد الزنزانات"],c:1},
{a:"بليتش",q:"ما اسم سيف إيتشيغو كوروساكي؟",o:["زانغيتسو","سينبونزاكورا","هيورينمارو","بينيهيمي"],c:0},
{a:"أكاديمية بطلي",q:"ما اسم القدرة التي ورثها ميدوريا؟",o:["الجميع للواحد","الواحد للجميع","الانفجار","الجليد والنار"],c:1},
{a:"الخيميائي الفولاذي",q:"ما القانون الأساسي للخيمياء؟",o:["التبادل المتكافئ","الخلق من العدم","الطاقة المطلقة","التحول"],c:0}
];
let st=JSON.parse(localStorage.getItem("am_v2"))||{s:1,h:3,l:null,list:Array.from({length:100},()=>Q[Math.floor(Math.random()*Q.length)])};
function sv(){localStorage.setItem("am_v2",JSON.stringify(st))}
function ui(){
  if(st.l&&Date.now()>=st.l){st.h=3;st.l=null;sv()}
  document.getElementById("h").innerText="❤️".repeat(st.h)+"🖤".repeat(3-st.h);
  document.getElementById("s").innerText=st.s+" / 100";
  document.getElementById("r").innerText=st.s<=25?"مبتدئ":st.s<=50?"مغامر":st.s<=75?"نخبة":"ماستر";
  if(st.h<=0){document.getElementById("play").style.display="none";document.getElementById("lk").style.display="block";return}
  document.getElementById("play").style.display="block";document.getElementById("lk").style.display="none";
  if(st.s>100){document.getElementById("an").innerText="مبروك!";document.getElementById("qt").innerText="أصبحت أنمي ماستر 🏆";document.getElementById("op").innerHTML='<button onclick="localStorage.removeItem(\'am_v2\');location.reload()">إعادة اللعب</button>';return}
  let cur=st.list[st.s-1];
  document.getElementById("an").innerText="أنمي: "+cur.a;
  document.getElementById("qt").innerText=cur.q;
  document.getElementById("op").innerHTML=cur.o.map((x,i)=>`<button onclick="ans(${i})">${x}</button>`).join("");
}
function ans(i){
  if(i===st.list[st.s-1].c){st.s++}else{st.h--;if(st.h<=0)st.l=Date.now()+86400000}
  sv();ui();
}
setInterval(()=>{
  if(!st.l)return;let d=st.l-Date.now();if(d<=0){ui();return}
  let h=String(Math.floor(d/3600000)).padStart(2,"0"),m=String(Math.floor(d/60000%60)).padStart(2,"0"),s=String(Math.floor(d/1000%60)).padStart(2,"0");
  document.getElementById("tm").innerText=h+":"+m+":"+s;
},1000);
ui();
</script>
</body>
</html>
