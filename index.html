
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime Master</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17142d;color:white;font-family:Arial,sans-serif}
header{background:#292044;padding:14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
h1{color:#d1baff}
button{background:#865be8;color:white;border:0;padding:12px;border-radius:12px;font-weight:bold;margin:4px;cursor:pointer}
.gold{background:#ffbf37;color:#382000}
.panel{background:#292044;border-radius:18px;padding:16px;margin:12px}
.screen{display:none;padding:10px;max-width:850px;margin:auto}
.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#40345f;padding:10px;border-radius:15px;text-align:center}
.avatar{height:145px;display:flex;justify-content:center;align-items:center}
.avatar svg{height:140px;width:110px}
.question{font-size:23px;font-weight:bold;line-height:1.6}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.answer{background:#40345f;color:white;min-height:55px}
.correct{background:#16875e}
.wrong{background:#b52e4e}
.progress{height:10px;background:#555;border-radius:20px;overflow:hidden}
.progress i{display:block;height:100%;background:#50d99c;width:0}
input,select{width:100%;padding:12px;margin:8px 0;border-radius:10px}
.stageGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stage{background:#40345f;padding:12px;text-align:center;border-radius:8px}
.done{background:#187b57}
@media(max-width:480px){.answers{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<b>⚔️ ANIME MASTER</b>
<div>🪙 <span id="coins">50</span>　❤️ <span id="hearts">5</span>
<button onclick="show('settings')">⚙️</button></div>
</header>

<main>
<section id="home" class="screen active">
<div class="panel" style="text-align:center;background:#483478">
<h1>🌟 ANIME MASTER</h1>
<p>كن سيد عالم الأنمي!</p>
<button class="gold" onclick="start()">ابدأ اللعبة ⚔️</button>
<button onclick="show('characters')">الشخصيات</button>
</div>
<div class="panel">
<div class="avatar" id="homeAvatar"></div>
<h3 id="player">بطل الأنمي</h3>
المستوى: <span id="level">1</span>
<div class="progress"><i id="homeBar"></i></div>
</div>
<div class="grid">
<button onclick="show('shop')">🛍️ المتجر</button>
<button onclick="show('stages')">🏆 المراحل</button>
<button onclick="show('characters')">🧑‍🎤 الشخصيات</button>
<button onclick="show('settings')">⚙️ الإعدادات</button>
</div>
</section>

<section id="characters" class="screen">
<div class="panel">
<h2>🧑‍🎤 اختر شخصيتك</h2>
<div class="grid" id="charGrid"></div>
<button onclick="choose()">اعتماد الشخصية</button>
<button onclick="show('home')">رجوع</button>
</div>
</section>

<section id="game" class="screen">
<div class="panel">
<div id="stageLabel">المرحلة 1</div>
<div class="progress"><i id="gameBar"></i></div>
<div class="avatar" id="gameAvatar"></div>
<p class="question" id="question"></p>
<div class="answers" id="answers"></div>
<p id="feedback"></p>
<button onclick="hint()">💡 تلميح (10 عملات)</button>
<button onclick="show('home')">خروج</button>
</div>
</section>

<section id="shop" class="screen">
<div class="panel">
<h2>🛍️ المتجر</h2>
<div id="shopGrid" class="grid"></div>
<button onclick="buyHeart()">❤️ قلب إضافي — 15 عملة</button>
<button onclick="show('home')">رجوع</button>
</div>
</section>

<section id="stages" class="screen">
<div class="panel">
<h2>🏆 المراحل</h2>
<div class="stageGrid" id="stagesGrid"></div>
<button onclick="show('home')">رجوع</button>
</div>
</section>

<section id="settings" class="screen">
<div class="panel">
<h2>⚙️ الإعدادات</h2>
<label>اسم اللاعب</label>
<input id="nameInput" placeholder="اسمك">
<button onclick="saveName()">حفظ الاسم</button>
<label>المظهر</label>
<select id="theme" onchange="setTheme(this.value)">
<option value="dark">داكن</option>
<option value="light">فاتح</option>
</select>
<label><input type="checkbox" id="sound" checked> المؤثرات الصوتية</label>
<label><input type="checkbox" id="music" onchange="musicToggle()"> تشغيل الموسيقى</label>
<p>ضع ملف الموسيقى باسم music.mp3 بجانب index.html.</p>
<button onclick="reset()">إعادة ضبط اللعبة</button>
<button onclick="show('home')">رجوع</button>
</div>
</section>

<section id="result" class="screen">
<div class="panel" style="text-align:center">
<h1 id="resultTitle">🎉 أحسنت!</h1>
<p id="resultText"></p>
<button onclick="show('home')">الرئيسية</button>
<button onclick="continueGame()">متابعة</button>
</div>
</section>
</main>

<audio id="musicPlayer" src="music.mp3" loop></audio>

<script>
const characters=[
['naruto','ناروتو','#efa52b','#ed7824'],
['nami','نامي','#f28a36','#e84e83'],
['mikasa','ميكاسا','#29202a','#76513c'],
['light','لايت','#9a6338','#b79b70'],
['nezuko','نيزوكو','#211622','#e78aaf'],
['goku','غوكو','#17131a','#e85b32'],
['nobara','نوبارا','#b94a28','#34313d'],
['touka','توكا','#4b343c','#eeeaf5'],
['gon','غون','#1c241d','#35a66d'],
['jinwoo','جين وو','#211c31','#24233c'],
['rukia','روكيا','#20202c','#eeeaf5'],
['saitama','سايتاما','#d9c18b','#e8b82f']
];

const questions=[
['ما اسم بطل ناروتو؟',['ناروتو','ساسكي','كاكاشي','إيتاتشي'],0],
['من قبطان قبعة القش؟',['زورو','لوفي','سانجي','أوسوب'],1],
['ما اسم أخت تانجيرو؟',['شينوبو','كاناو','نيزوكو','ميتسوري'],2],
['من بطل Death Note؟',['إل','لايت','ريوك','مات'],1],
['من بطل Dragon Ball؟',['فيجيتا','غوهان','غوكو','ترانكس'],2],
['من قائد فرقة الاستطلاع؟',['ليفاي','إيرين','أرمين','جان'],0],
['ما سلاح زورو؟',['رمح','ثلاثة سيوف','قوس','فأس'],1],
['ما اسم قرية ناروتو؟',['الرمل','الصخر','الورق','الصوت'],2],
['ما اسم دفتر لايت؟',['دفتر الموت','دفتر الظلال','دفتر الأرواح','دفتر الليل'],0],
['من صديق غون؟',['كيلوا','كورابيكا','ليوريو','هيسوكا'],0],
['ما لقب سايتاما؟',['نينجا','البطل الأصلع','ملك القراصنة','الشينيغامي'],1],
['ما اسم بطل Solo Leveling؟',['جين وو','غون','إيتشيغو','إدوارد'],0],
['ما لون شعر ميكاسا؟',['أشقر','أحمر','أسود','أزرق'],2],
['ما تقنية ناروتو الشهيرة؟',['راسينغان','تشيدوري','كاميهاميها','هادو'],0],
['ما اسم تنفس زينيتسو؟',['الرعد','الماء','النار','الضباب'],0],
['من طباخ طاقم لوفي؟',['زورو','سانجي','فرانكي','بروك'],1],
['ما اسم والد غون؟',['جين','كيلوا','ليوريو','كورابيكا'],0],
['ما قوة إيرين؟',['العملاق المهاجم','الشارينغان','الكي','الهاكي'],0],
['من مستخدمة المطرقة في Jujutsu Kaisen؟',['نوبارا','ماكي','مي مي','يوكي'],0],
['ما اسم بطل Tokyo Ghoul؟',['كانيكي','توكا','أريما','هيدي'],0],
['ما اسم وحش ناروتو؟',['كوراما','شوكـاكو','ماتاتابي','غيوكي'],0],
['ما اسم أخ غوكو؟',['راديتز','فيجيتا','بيروس','بيكولو'],0],
['ما اسم سيف إيتشيغو؟',['زانباكتو','إكسكاليبر','إنما','شوسوي'],0],
['من رفيقة لايت؟',['ميسا','نامي','روكيا','نوبارا'],0],
['من والد إيرين؟',['غريشا','ليفاي','إروين','جان'],0],
['ما اسم صديق ناروتو المنافس؟',['شيكامارو','ساسكي','كيبا','نيجي'],1]
];

let data=JSON.parse(localStorage.getItem('animeMaster')||'null')||{
coins:50,hearts:5,answered:0,selected:'naruto',
owned:['naruto'],name:'بطل الأنمي',theme:'dark'
};
let temp=data.selected,order=[],pos=0,current=null,locked=false;

function save(){
localStorage.setItem('animeMaster',JSON.stringify(data));
update();
}
function character(id){
return characters.find(c=>c[0]===id)||characters[0];
}
function drawing(c){
let hair=c[2],coat=c[3];
return `<svg viewBox="0 0 120 160">
<ellipse cx="60" cy="151" rx="35" ry="6" fill="#000" opacity=".2"/>
<path d="M37 91L22 140Q60 155 98 140L83 91Z" fill="${coat}" stroke="#21182c" stroke-width="3"/>
<path d="M43 137L40 151L55 151L58 140M67 140L70 151L85 151L78 137" fill="#eee" stroke="#21182c" stroke-width="3"/>
<path d="M36 73L30 110L42 114L47 92M84 73L90 110L78 114L73 92" fill="${coat}" stroke="#21182c" stroke-width="3"/>
<ellipse cx="60" cy="57" rx="34" ry="39" fill="#f1c5a6" stroke="#21182c" stroke-width="3"/>
<path d="M30 59Q24 20 50 15Q85 5 91 60Q78 43 66 40Q47 49 30 59" fill="${hair}" stroke="#21182c" stroke-width="3"/>
<ellipse cx="47" cy="62" rx="7" ry="9" fill="white"/>
<ellipse cx="73" cy="62" rx="7" ry="9" fill="white"/>
<circle cx="48" cy="64" r="4" fill="#6949a9"/>
<circle cx="74" cy="64" r="4" fill="#6949a9"/>
<path d="M53 80Q60 86 68 79" fill="none" stroke="#9d4b55" stroke-width="3"/>
<circle cx="36" cy="76" r="5" fill="#f08c91"/>
<circle cx="84" cy="76" r="5" fill="#f08c91"/>
</svg>`;
}
function show(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
if(id==='characters')renderCharacters();
if(id==='shop')renderShop();
if(id==='stages')renderStages();
update();window.scrollTo(0,0);
}
function update(){
coins.textContent=data.coins;
hearts.textContent=data.hearts;
player.textContent=data.name;
level.textContent=Math.floor(data.answered/5)+1;
homeAvatar.innerHTML=drawing(character(data.selected));
gameAvatar.innerHTML=drawing(character(data.selected));
homeBar.style.width=data.answered/50*100+'%';
gameBar.style.width=data.answered/50*100+'%';
nameInput.value=data.name;
theme.value=data.theme;
document.body.style.background=data.theme==='light'?'#eee8ff':'#17142d';
document.body.style.color=data.theme==='light'?'#241b3b':'white';
}
function renderCharacters(){
charGrid.innerHTML=characters.map(c=>`
<div class="card" style="${temp===c[0]?'border:2px solid gold':''}" onclick="temp='${c[0]}';renderCharacters()">
<div class="avatar">${drawing(c)}</div>
<b>${c[1]}</b><p>${data.owned.includes(c[0])?'متاحة':'🔒 مقفلة'}</p>
</div>`).join('');
}
function choose(){
if(!data.owned.includes(temp)){alert('اشترِ الشخصية من المتجر أولاً');return;}
data.selected=temp;save();show('home');
}
function renderShop(){
shopGrid.innerHTML=characters.filter(c=>!data.owned.includes(c[0])).map(c=>`
<div class="card"><div class="avatar">${drawing(c)}</div>
<b>${c[1]}</b><button class="gold" onclick="buyChar('${c[0]}')">50 🪙</button></div>`).join('');
}
function buyChar(id){
if(data.coins<50)return alert('تحتاج 50 عملة');
data.coins-=50;data.owned.push(id);save();renderShop();
}
function buyHeart(){
if(data.coins<15)return alert('تحتاج 15 عملة');
if(data.hearts>=5)return alert('قلوبك ممتلئة');
data.coins-=15;data.hearts++;save();
}
function renderStages(){
stagesGrid.innerHTML=Array.from({length:50},(_,i)=>
`<div class="stage ${i<data.answered?'done':''}">${i<data.answered?'✓':i+1}</div>`).join('');
}
function start(){
if(data.hearts<=0)return result('💔','انتهت القلوب','اشتر قلباً من المتجر.');
if(data.answered>=50)return result('🏆','أنهيت اللعبة!','أنت سيد الأنمي!');
if(!order.length||pos>=order.length){
order=Array.from({length:questions.length},(_,i)=>i).sort(()=>Math.random()-.5);pos=0;
}
show('game');loadQuestion();
}
function loadQuestion(){
locked=false;current=questions[order[pos]];
stageLabel.textContent='المرحلة '+(data.answered+1)+' من 50';
question.textContent=current[0];feedback.textContent='';
let options=current[1].map((v,i)=>({v,i})).sort(()=>Math.random()-.5);
answers.innerHTML=options.map(o=>`<button class="answer" data-ok="${o.i===current[2]}" onclick="answer(this)">${o.v}</button>`).join('');
}
function answer(btn){
if(locked)return;locked=true;
let ok=btn.dataset.ok==='true';
document.querySelectorAll('.answer').forEach(b=>{
b.disabled=true;if(b.dataset.ok==='true')b.classList.add('correct');
});
if(ok){
data.coins+=2;feedback.textContent='✨ إجابة صحيحة! +2 عملة';
}else{
data.hearts=Math.max(0,data.hearts-1);btn.classList.add('wrong');
feedback.textContent='❌ خطأ! الإجابة: '+current[1][current[2]];
}
data.answered++;pos++;save();
setTimeout(()=>{
if(data.hearts<=0)result('💔','انتهت القلوب','اشتر قلباً مقابل 15 عملة.');
else if(data.answered>=50)result('🏆','مبروك!','أنهيت خمسين سؤالاً!');
else loadQuestion();
},1100);
}
function hint(){
if(locked)return;
if(data.coins<10)return alert('تحتاج 10 عملات');
data.coins-=10;
let wrong=[...document.querySelectorAll('.answer')].filter(b=>b.dataset.ok!=='true');
wrong.slice(0,2).forEach(b=>{b.disabled=true;b.style.opacity='.3'});
save();
}
function result(title,msg,desc){
resultTitle.textContent=title+' '+msg;
resultText.textContent=desc;show('result');
}
function continueGame(){
if(data.hearts<=0&&data.coins>=15&&confirm('شراء قلب بـ15 عملة؟')){
data.coins-=15;data.hearts=1;save();
}
if(data.answered>=50){data.answered=0;data.hearts=5;order=[];pos=0;save();}
show('home');
}
function saveName(){data.name=nameInput.value.trim()||'بطل الأنمي';save();alert('تم الحفظ');}
function setTheme(v){data.theme=v;save();}
function musicToggle(){
let a=document.getElementById('musicPlayer');
if(music.checked)a.play().catch(()=>alert('ضع ملف music.mp3 بجانب index.html'));
else a.pause();
}
function reset(){
if(!confirm('حذف كل تقدمك؟'))return;
localStorage.removeItem('animeMaster');
data={coins:50,hearts:5,answered:0,selected:'naruto',owned:['naruto'],name:'بطل الأنمي',theme:'dark'};
order=[];pos=0;save();show('home');
}
update();
</script>
</body>
</html>
